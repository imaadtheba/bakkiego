<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F5F0E8">
  <title>BakkieGo — Job Status</title>
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #F5F0E8;
      color: #1A1A2E;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100dvh;
      padding: 20px;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      min-height: calc(100dvh - 40px);
      display: flex;
      flex-direction: column;
    }

    .back-link {
      color: #6B7280;
      text-decoration: none;
      font-size: 15px;
      flex-shrink: 0;
    }

    #status-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* ── Shared layout ── */
    .view-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 0 48px;
    }

    .view-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .view-sub {
      font-size: 15px;
      color: #6B7280;
    }

    /* ── Summary card ── */
    .info-card {
      width: 100%;
      background: #FFFFFF;
      border: 1.5px solid #E8EDF2;
      border-radius: 16px;
      padding: 4px 20px;
      margin: 24px 0;
      text-align: left;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid #E8EDF2;
    }

    .info-row:last-child { border-bottom: none; }

    .info-label { font-size: 14px; color: #6B7280; }

    .info-value { font-size: 14px; font-weight: 600; text-align: right; }
    .info-value.green  { color: #00C853; }
    .info-value.orange { color: #FF6D00; }

    /* ── Buttons ── */
    .btn {
      display: block;
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 18px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 10px;
    }

    .btn:first-of-type { margin-top: 0; }
    .btn:active { opacity: 0.84; transform: scale(0.98); }

    .btn-green   { background: #FF6D00; color: #1A1A2E; }
    .btn-outline { background: transparent; color: #1A1A2E; border: 1.5px solid #E8EDF2; }
    .btn-muted   { background: transparent; color: #6B7280; border: 1.5px solid #E8EDF2; font-size: 14px; padding: 14px; }

    .btn-stack { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .btn-stack .btn { margin-top: 0; }

    /* ── Pulse (posted state) ── */
    @keyframes pulse-ring {
      0%   { transform: scale(1);   opacity: 0.6; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    .pulse-wrap {
      position: relative;
      width: 88px;
      height: 88px;
      margin: 0 auto 32px;
    }

    .pulse-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid #00C853;
      animation: pulse-ring 2.4s ease-out infinite;
    }

    .pulse-ring:nth-child(2) { animation-delay: 0.8s; }
    .pulse-ring:nth-child(3) { animation-delay: 1.6s; }

    .pulse-core {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(255, 109, 0, 0.1);
      border: 2px solid rgba(255, 109, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }

    /* ── Counter offer state ── */
    .counter-amount {
      font-size: 56px;
      font-weight: 800;
      color: #FF6D00;
      line-height: 1;
      margin: 16px 0 8px;
    }

    .counter-original {
      font-size: 14px;
      color: #6B7280;
      margin-bottom: 8px;
    }

    /* ── Driver card ── */
    .driver-card {
      width: 100%;
      background: #FFFFFF;
      border: 1px solid #E8EDF2;
      border-radius: 16px;
      padding: 20px 16px 16px;
      text-align: center;
      margin-top: 16px;
    }

    .driver-card-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #1B4332;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }

    .driver-card-eyebrow {
      font-size: 11px;
      font-weight: 700;
      color: #8896A5;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .driver-card-name {
      font-size: 18px;
      font-weight: 700;
      color: #1A1A2E;
      margin-bottom: 10px;
    }

    .driver-card-detail {
      font-size: 15px;
      font-weight: 600;
      color: #4B5563;
      line-height: 1.5;
      margin-top: 4px;
    }

    .driver-card-plate {
      font-size: 20px;
      font-weight: 800;
      color: #1A1A2E;
      letter-spacing: 1.5px;
      margin-top: 6px;
    }

    /* ── Accepted state ── */
    .big-emoji {
      font-size: 60px;
      margin-bottom: 16px;
      line-height: 1;
    }

    .agreed-price {
      font-size: 40px;
      font-weight: 800;
      color: #00C853;
      margin: 16px 0 4px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.supabase = window.supabase.createClient(
      'https://jtemxqxzgdboxknpfesb.supabase.co',
      'sb_publishable_Da9LJuPKvJoqv_yojX5OSA_oQie51hs'
    );
  </script>
</head>
<body>
<div class="page">
  <a href="trader-home.html" class="back-link">← Home</a>
  <div id="reminder-banner" style="display:none;background:#FFF8E1;border:1.5px solid #F59E0B;border-radius:12px;padding:12px 16px;margin-top:12px;font-size:14px;font-weight:600;color:#92400E;align-items:center;justify-content:space-between;gap:12px">
    <span id="reminder-text"></span>
    <button onclick="dismissReminder()" style="background:none;border:none;cursor:pointer;color:#92400E;font-size:18px;line-height:1;padding:0 0 0 8px;flex-shrink:0">✕</button>
  </div>
  <div id="status-content"></div>
  <div style="text-align:center;padding:24px 0 8px">
    <button onclick="logout()" style="background:none;border:none;color:#8896A5;font-size:12px;font-family:inherit;cursor:pointer">Log out</button>
  </div>
</div>
<script>
const user = JSON.parse(localStorage.getItem('user') || 'null');
if (!user) { window.location.replace('login.html'); }

let job = null;

async function findMyJob() {
  const { data } = await supabase
    .from('jobs')
    .select('*, driver:users!driver_id(name, phone, vehicle_model, vehicle_colour, vehicle_plate)')
    .eq('trader_id', user.id)
    .neq('status', 'completed')
    .neq('status', 'cancelled')
    .order('created_at', { ascending: false })
    .limit(1).maybeSingle();
  return data;
}

async function patchJob(updates) {
  if (!job) return;
  const { error } = await supabase.from('jobs').update(updates).eq('id', job.id);
  if (error) { console.error('patchJob error:', error); return; }
  Object.assign(job, updates);
}

function render() {
  const el = document.getElementById('status-content');
  if (!job) { window.location.replace('trader-home.html'); return; }
  switch (job.status) {
    case 'posted':      el.innerHTML = viewPosted();                              break;
    case 'countered':   el.innerHTML = viewNegotiating();                         break;
    case 'accepted':    el.innerHTML = viewDriverStatus('✅', 'Bakkie confirmed!',     'Waiting for your driver'); break;
    case 'on_the_way':  el.innerHTML = viewDriverStatus('🚗', 'Driver on the way!',   'Your bakkie is heading to you'); break;
    case 'in_progress': el.innerHTML = viewDriverStatus('📦', 'Job in progress',       'Load has been picked up');       break;
    case 'completed':   el.innerHTML = viewCompleted();                           break;
    default:            el.innerHTML = viewPosted();
  }
  bindActions();
  checkReminder();
}

function viewPosted() {
  return `
    <div class="view-center">
      <div class="pulse-wrap">
        <div class="pulse-ring"></div><div class="pulse-ring"></div>
        <div class="pulse-ring"></div><div class="pulse-core">🚛</div>
      </div>
      <div class="view-title">Looking for a driver...</div>
      <div class="view-sub">${job.area} &middot; R${job.offer_price}</div>
      ${job.address ? `<div class="view-sub" style="margin-top:6px;font-size:13px">Delivering to: ${job.address}</div>` : ''}
      <div class="btn-stack" style="margin-top:40px">
        <button class="btn btn-muted" id="btn-cancel">Cancel job</button>
      </div>
    </div>`;
}

function viewNegotiating() {
  return `
    <div class="view-center">
      <div class="view-sub" style="margin-bottom:4px">A driver wants to negotiate</div>
      <div class="view-title">Counter offer</div>
      <div class="counter-amount">R${job.counter_price}</div>
      <div class="counter-original">Your original offer: R${job.offer_price}</div>
      <div class="btn-stack" style="margin-top:24px;width:100%">
        <button class="btn btn-green"   id="btn-accept-counter">Accept R${job.counter_price}</button>
        <button class="btn btn-outline" id="btn-decline">Decline</button>
      </div>
    </div>`;
}

function driverCard() {
  if (!job.driver_id || !job.driver) return '';
  const d = job.driver;
  const vehicleDesc = [d.vehicle_colour, d.vehicle_model].filter(Boolean).join(' ');
  return `
    <div class="driver-card">
      <div class="driver-card-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="8" r="4" fill="white"/>
          <path d="M4 20c0-4 3.582-7 8-7s8 3 8 7" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="driver-card-eyebrow">Your Driver</div>
      <div class="driver-card-name">${d.name || 'Your driver'}</div>
      ${vehicleDesc ? `<div class="driver-card-detail">${vehicleDesc}</div>` : ''}
      ${d.vehicle_plate ? `<div class="driver-card-plate">${d.vehicle_plate}</div>` : ''}
    </div>`;
}

function viewDriverStatus(emoji, title, subtitle) {
  const price       = job.counter_price || job.offer_price;
  const driverName  = job.driver?.name  || 'Your driver';
  const driverPhone = job.driver?.phone || '';
  const waPhone     = driverPhone.startsWith('0') ? '27' + driverPhone.slice(1) : driverPhone.replace(/\D/g,'');
  const showNoShow  = user.role === 'trader'
    && (job.status === 'accepted' || job.status === 'on_the_way');
  return `
    <div class="view-center">
      <div class="big-emoji">${emoji}</div>
      <div class="view-title">${title}</div>
      <div class="view-sub">${subtitle}</div>
      <div class="agreed-price">R${price}</div>
      <div class="info-card">
        <div class="info-row"><span class="info-label">Area</span><span class="info-value">${job.area}</span></div>
        ${job.address ? `<div class="info-row"><span class="info-label">Delivering to</span><span class="info-value">${job.address}</span></div>` : ''}
        <div class="info-row"><span class="info-label">Agreed price</span><span class="info-value green">R${price}</span></div>
        <div class="info-row"><span class="info-label">Payment</span><span class="info-value">Cash to driver</span></div>
      </div>
      ${driverCard()}
      <a href="${waPhone ? `https://wa.me/${waPhone}` : '#'}" class="btn btn-green" style="width:100%">WhatsApp ${driverName}</a>
      ${(user.role === 'trader' && (job.status === 'on_the_way' || job.status === 'in_progress')) ? `
      <button class="btn" style="width:100%;margin-top:16px;background:#fff;border:2px solid #FF6D00;color:#FF6D00" id="btn-mark-delivered">Mark as Delivered</button>
      <div id="delivered-confirm" style="display:none;text-align:center;color:#00C853;font-weight:700;font-size:14px;margin-top:6px">Delivery confirmed!</div>
      ` : ''}
      ${showNoShow ? `
      <button class="btn" style="width:100%;margin-top:12px;background:#fff;border:2px solid #EF4444;color:#EF4444" id="btn-no-show">Driver didn't arrive</button>
      ` : ''}
    </div>`;
}

function viewCompleted() {
  const price = job.counter_price || job.offer_price;
  return `
    <div class="view-center">
      <div class="big-emoji">🎉</div>
      <div class="view-title">Trip complete!</div>
      <div class="view-sub" style="margin-bottom:0">${job.area}</div>
      <div class="info-card">
        <div class="info-row"><span class="info-label">Area</span><span class="info-value">${job.area}</span></div>
        ${job.address ? `<div class="info-row"><span class="info-label">Delivered to</span><span class="info-value">${job.address}</span></div>` : ''}
        <div class="info-row"><span class="info-label">Paid</span><span class="info-value green">R${price}</span></div>
        <div class="info-row"><span class="info-label">Payment</span><span class="info-value">Cash</span></div>
      </div>
      ${driverCard()}
      <button class="btn btn-green" style="width:100%" onclick="location.href='trader-home.html'">Book another bakkie</button>
    </div>`;
}

function bindActions() {
  const btnCancel = document.getElementById('btn-cancel');
  if (btnCancel) btnCancel.addEventListener('click', async () => {
    if (!confirm('Cancel this job?')) return;
    // Soft-cancel: keep driver_id so the assigned driver can still be notified
    const { error } = await supabase
      .from('jobs')
      .update({ status: 'cancelled', completed_at: new Date().toISOString() })
      .eq('id', job.id);
    if (error) {
      console.error('Cancel error:', error);
      alert('Failed to cancel: ' + error.message);
      return;
    }
    location.href = 'trader-home.html';
  });

  const btnAccept = document.getElementById('btn-accept-counter');
  if (btnAccept) btnAccept.addEventListener('click', async () => {
    await patchJob({ status: 'accepted' });
    // Re-fetch with driver join so driver name/phone is available
    const { data } = await supabase
      .from('jobs').select('*, driver:users!driver_id(name, phone, vehicle_model, vehicle_colour, vehicle_plate)').eq('id', job.id).single();
    if (data) job = data;
    render();
  });

  const btnDecline = document.getElementById('btn-decline');
  if (btnDecline) btnDecline.addEventListener('click', async () => {
    const { error } = await supabase.from('jobs')
      .update({ status: 'posted', driver_id: null, counter_price: null })
      .eq('id', job.id);
    if (error) { console.error('Decline error:', error); alert('Failed to decline offer.'); return; }
    location.href = 'trader-home.html';
  });

  const btnNoShow = document.getElementById('btn-no-show');
  if (btnNoShow) btnNoShow.addEventListener('click', async () => {
    if (!confirm("Driver didn't arrive? The job will be offered to other drivers again.")) return;
    btnNoShow.disabled = true;
    // Re-post to the open feed; keep nothing of the old assignment
    await patchJob({ status: 'posted', driver_id: null, counter_price: null });
    location.href = 'trader-home.html';
  });

  const btnMarkDelivered = document.getElementById('btn-mark-delivered');
  if (btnMarkDelivered) btnMarkDelivered.addEventListener('click', async () => {
    if (!confirm('Confirm delivery?')) return;
    btnMarkDelivered.disabled = true;
    await patchJob({ status: 'completed', completed_at: new Date().toISOString() });
    document.getElementById('delivered-confirm').style.display = 'block';
    setTimeout(render, 1200);
  });
}

let realtimeChannel = null;
let reconnectTimer  = null;
let isReconnecting  = false;
let isRefreshing    = false;

async function setupRealtime() {
  if (isReconnecting) { console.log('[realtime] setup already in progress — skipping'); return; }
  isReconnecting = true;
  try {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    if (realtimeChannel) {
      const old = realtimeChannel;
      realtimeChannel = null;
      await supabase.removeChannel(old);
    }
    const channelName = 'job-status-' + job.id;
    console.log('[realtime] creating channel:', channelName);
    const channel = supabase.channel(channelName);
    console.log('[realtime] channel object created:', channel);
    realtimeChannel = channel;

    channel
      .on('postgres_changes', { event: '*', schema: 'public', table: 'jobs',
          filter: `id=eq.${job.id}` }, (payload) => {
        console.log('[realtime] event received:', payload.eventType, 'old:', payload.old, 'new:', payload.new);
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'jobs',
          filter: `id=eq.${job.id}` }, async (payload) => {
        console.log('Job updated (realtime):', payload.new?.status);
        const { data } = await supabase
          .from('jobs').select('*, driver:users!driver_id(name, phone, vehicle_model, vehicle_colour, vehicle_plate)').eq('id', job.id).single();
        if (data) { job = data; render(); }
      })
      .subscribe((status, err) => {
        console.log('[realtime] subscribe callback - status:', status, 'error:', err || 'none');
        if (channel !== realtimeChannel) { console.log('[realtime] stale channel callback ignored'); return; }
        if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') scheduleReconnect();
      });
  } finally {
    isReconnecting = false;
  }
}

function scheduleReconnect() {
  if (reconnectTimer) return;
  if (document.visibilityState !== 'visible') return;
  console.log('[realtime] scheduling reconnect in 3s …');
  reconnectTimer = setTimeout(() => { reconnectTimer = null; setupRealtime(); }, 3000);
}

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') {
    console.log('[visibility] hidden — clearing pending reconnect');
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    return;
  }
  console.log('[visibility] visible — enter');
  if (isRefreshing) { console.log('[visibility] refresh already in flight — skipping'); console.log('[visibility] exit'); return; }
  isRefreshing = true;
  try {
    if (job) {
      const { data } = await supabase
        .from('jobs').select('*, driver:users!driver_id(name, phone, vehicle_model, vehicle_colour, vehicle_plate)')
        .eq('id', job.id).single();
      if (data) { job = data; render(); }
    }
    if (!realtimeChannel || realtimeChannel.state !== 'joined') {
      console.log('[realtime] channel not subscribed — reconnecting');
      await setupRealtime();
    }
  } catch (e) {
    console.warn('[visibility] refresh failed:', e);
  } finally {
    isRefreshing = false;
    console.log('[visibility] exit');
  }
});

function logout() {
  localStorage.removeItem('user');
  window.location.href = 'login.html';
}

let reminderDismissed = false;
let lastReminderStatus = null;

function checkReminder() {
  if (!job || user.role !== 'trader') return;
  if (job.status !== lastReminderStatus) {
    reminderDismissed = false;
    lastReminderStatus = job.status;
  }
  const banner = document.getElementById('reminder-banner');
  const text   = document.getElementById('reminder-text');
  if (reminderDismissed) { banner.style.display = 'none'; return; }
  const ageMin = (Date.now() - new Date(job.updated_at).getTime()) / 60000;
  const message = (job.status === 'in_progress' && ageMin > 20)
    ? 'Has your load been delivered? Tap to confirm delivery'
    : null;
  if (message) { text.textContent = message; banner.style.display = 'flex'; }
  else         { banner.style.display = 'none'; }
}

function dismissReminder() {
  reminderDismissed = true;
  document.getElementById('reminder-banner').style.display = 'none';
}

async function init() {
  job = await findMyJob();
  if (!job) { window.location.replace('trader-home.html'); return; }

  if (['on_the_way', 'in_progress'].includes(job.status)) {
    const ageMs = Date.now() - new Date(job.updated_at).getTime();
    if (ageMs > 8 * 60 * 60 * 1000) {
      await patchJob({ status: 'completed', completed_at: new Date().toISOString() });
    }
  }

  render();
  setupRealtime();
  setInterval(checkReminder, 60000);
}

init();
</script>
<script src="notifications.js"></script>
</body>
</html>
