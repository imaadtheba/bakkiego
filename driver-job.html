<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F5F0E8">
  <title>BakkieGo — Active Job</title>
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #F5F0E8;
      color: #1A1A2E;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100dvh;
      padding: 20px;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .back-link {
      color: #6B7280;
      text-decoration: none;
      font-size: 15px;
    }

    /* ── Job header ── */
    .job-header {
      margin-top: 4px;
    }

    .job-area {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .job-price {
      font-size: 22px;
      font-weight: 700;
      color: #00C853;
    }

    /* ── Info card ── */
    .info-card {
      background: #FFFFFF;
      border: 1.5px solid #E8EDF2;
      border-radius: 16px;
      padding: 4px 20px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid #E8EDF2;
    }

    .info-row:last-child { border-bottom: none; }
    .info-label { font-size: 14px; font-weight: 600;
    color: #6B7280; }
    .info-value { font-size: 14px; font-weight: 600; text-align: right; }
    .info-value.green { color: #00C853; }

    /* ── Buttons ── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 18px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active { opacity: 0.84; transform: scale(0.98); }

    .btn-green   { background: #FF6D00; color: #1A1A2E; }
    .btn-orange  { background: #FF6D00; color: #1A1A2E; }
    .btn-outline { background: transparent; color: #1A1A2E; border: 1.5px solid #E8EDF2; }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      color: #6B7280;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .divider {
      height: 1px;
      background: #E8EDF2;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.supabase = window.supabase.createClient(
      'https://jtemxqxzgdboxknpfesb.supabase.co',
      'sb_publishable_Da9LJuPKvJoqv_yojX5OSA_oQie51hs'
    );
  </script>
</head>
<body>
<div class="page">
  <a href="driver-home.html" class="back-link">← Jobs</a>

  <div id="reminder-banner" style="display:none;background:#FFF8E1;border:1.5px solid #F59E0B;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600;color:#92400E;align-items:center;justify-content:space-between;gap:12px">
    <span id="reminder-text"></span>
    <button onclick="dismissReminder()" style="background:none;border:none;cursor:pointer;color:#92400E;font-size:18px;line-height:1;padding:0 0 0 8px;flex-shrink:0">✕</button>
  </div>

  <div class="job-header">
    <div class="job-area" id="job-area">—</div>
    <div class="job-price" id="job-price">—</div>
  </div>

  <div class="info-card">
    <div class="info-row">
      <span class="info-label">Pickup</span>
      <span class="info-value" style="text-align:right">Tshwane Fresh Produce Market</span>
    </div>
    <div class="info-row">
      <span class="info-label">Area</span>
      <span class="info-value" id="detail-area">—</span>
    </div>
    <div class="info-row" id="address-row" style="display:none">
      <span class="info-label">Drop-off</span>
      <span class="info-value" id="detail-address" style="max-width:60%;word-break:break-word;text-align:right">—</span>
    </div>
    <div class="info-row" id="load-row" style="display:none">
      <span class="info-label">Load size</span>
      <span class="info-value" id="detail-load">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Agreed price</span>
      <span class="info-value green" id="detail-price">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Payment</span>
      <span class="info-value">Cash</span>
    </div>
  </div>

  <div class="section-label">Contact &amp; Navigation</div>

  <a id="btn-whatsapp" href="#" class="btn btn-green">📱 WhatsApp Trader</a>
  <a
    id="btn-directions"
    href="#"
    target="_blank"
    class="btn btn-outline"
  >🗺 Get Directions</a>

  <div class="divider"></div>

  <div class="section-label">Job Progress</div>

  <button class="btn btn-orange" id="btn-on-the-way" onclick="onTheWay()">🚗 I'm On My Way</button>

  <div id="banner-on-the-way" style="display:none;background:rgba(255,109,0,0.1);border:1.5px solid #FF6D00;border-radius:16px;padding:16px;text-align:center;color:#FF6D00;font-weight:700;font-size:15px">
    🚗 You're on the way
  </div>

  <button class="btn btn-orange" id="btn-pickup" onclick="pickup()" style="display:none">✅ I've Arrived — Pickup load</button>
  <button class="btn btn-green"  id="btn-done"   onclick="jobDone()" style="display:none">Job done — cash received ✓</button>

  <button class="btn" id="btn-cancel-job" onclick="cancelJob()" style="display:none;margin-top:32px;background:#fff;border:2px solid #EF4444;color:#EF4444">Cancel job</button>

  <div style="text-align:center;padding:24px 0 8px">
    <button onclick="logout()" style="background:none;border:none;color:#8896A5;font-size:12px;font-family:inherit;cursor:pointer">Log out</button>
  </div>
</div>
<script>
const user = JSON.parse(localStorage.getItem('user') || 'null');
if (!user) { window.location.replace('login.html'); }

function logout() {
  localStorage.removeItem('user');
  window.location.href = 'login.html';
}

let job = null;

function render() {
  if (!job) return;
  const price = job.counter_price || job.offer_price;

  document.getElementById('job-area').textContent     = job.area;
  document.getElementById('job-price').textContent    = `R${price}`;
  document.getElementById('detail-area').textContent  = job.area;
  document.getElementById('detail-price').textContent = `R${price}`;

  if (job.address) {
    document.getElementById('detail-address').textContent = job.address;
    document.getElementById('address-row').style.display  = '';
  }

  // Use precise coords if available, else fall back to address search
  if (job.lat && job.lng) {
    document.getElementById('btn-directions').href =
      `https://www.google.com/maps/dir/?api=1&destination=${job.lat},${job.lng}`;
  } else if (job.address) {
    document.getElementById('btn-directions').href =
      `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(job.address)}`;
  } else {
    document.getElementById('btn-directions').href =
      'https://www.google.com/maps/dir/?api=1&destination=-25.7479,28.1878';
  }

  if (job.load_size) {
    const labels = { small: '📦 Small load', medium: '🛒 Half bakkie', large: '🚛 Full bakkie' };
    document.getElementById('detail-load').textContent = labels[job.load_size] || job.load_size;
    document.getElementById('load-row').style.display  = '';
  }

  const traderPhone = job.trader?.phone || '';
  const waPhone = traderPhone.startsWith('0') ? '27' + traderPhone.slice(1) : traderPhone.replace(/\D/g,'');
  document.getElementById('btn-whatsapp').href = waPhone ? `https://wa.me/${waPhone}` : '#';

  const s = job.status;
  document.getElementById('btn-on-the-way').style.display    = s === 'accepted'    ? ''     : 'none';
  document.getElementById('banner-on-the-way').style.display = s === 'on_the_way'  ? ''     : 'none';
  document.getElementById('btn-pickup').style.display        = s === 'on_the_way'  ? ''     : 'none';
  document.getElementById('btn-done').style.display          = s === 'in_progress' ? ''     : 'none';
  document.getElementById('btn-cancel-job').style.display    =
    (job.driver_id === user.id && ['accepted', 'on_the_way', 'in_progress'].includes(s)) ? '' : 'none';
}

async function onTheWay() {
  const { error } = await supabase.from('jobs').update({ status: 'on_the_way' }).eq('id', job.id);
  if (error) { alert('Failed to update status.'); return; }
  job.status = 'on_the_way';
  render();
}

async function pickup() {
  const { error } = await supabase.from('jobs').update({ status: 'in_progress' }).eq('id', job.id);
  if (error) { alert('Failed to update status.'); return; }
  job.status = 'in_progress';
  render();
}

async function cancelJob() {
  if (!confirm('Cancel this job? It will be offered to other drivers again.')) return;
  const { error } = await supabase.from('jobs')
    .update({ status: 'posted', driver_id: null, counter_price: null })
    .eq('id', job.id);
  if (error) { alert('Failed to cancel job.'); return; }
  localStorage.removeItem('driver_active_job_id');
  location.href = 'driver-home.html';
}

async function jobDone() {
  const { error } = await supabase.from('jobs')
    .update({ status: 'completed', completed_at: new Date().toISOString() })
    .eq('id', job.id);
  if (error) { alert('Failed to complete job.'); return; }
  localStorage.removeItem('driver_active_job_id');
  location.href = 'driver-home.html';
}

let realtimeChannel = null;

function setupRealtime() {
  if (realtimeChannel) { supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
  const channelName = 'driver-job-' + job.id;
  console.log('[realtime] creating channel:', channelName);
  const channel = supabase.channel(channelName);
  console.log('[realtime] channel object created:', channel);
  realtimeChannel = channel;

  channel
    .on('postgres_changes', { event: '*', schema: 'public', table: 'jobs',
        filter: `id=eq.${job.id}` }, (payload) => {
      console.log('[realtime] event received:', payload.eventType, 'old:', payload.old, 'new:', payload.new);
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'jobs',
        filter: `id=eq.${job.id}` }, async (payload) => {
      console.log('Job updated (realtime):', payload.new?.status);
      const { data } = await supabase
        .from('jobs').select('*, trader:users!trader_id(name, phone)').eq('id', job.id).single();
      if (data) { job = data; render(); checkReminder(); }
    })
    .subscribe((status, err) => {
      console.log('[realtime] subscribe callback - status:', status, 'error:', err || 'none');
      if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
        console.log('[realtime] reconnecting after', status, '...');
        supabase.removeChannel(channel);
        realtimeChannel = null;
        setTimeout(setupRealtime, 3000);
      }
    });
}

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') return;
  console.log('[realtime] page visible — refreshing data');
  if (job) {
    const { data } = await supabase
      .from('jobs').select('*, trader:users!trader_id(name, phone)')
      .eq('id', job.id).single();
    if (data) { job = data; render(); checkReminder(); }
  }
  if (!realtimeChannel || realtimeChannel.state !== 'joined') {
    console.log('[realtime] channel not subscribed — reconnecting');
    setupRealtime();
  }
});

let reminderDismissed = false;
let lastReminderStatus = null;

function checkReminder() {
  if (!job) return;
  if (job.status !== lastReminderStatus) {
    reminderDismissed = false;
    lastReminderStatus = job.status;
  }
  const banner = document.getElementById('reminder-banner');
  const text   = document.getElementById('reminder-text');
  if (reminderDismissed) { banner.style.display = 'none'; return; }
  const ageMin = (Date.now() - new Date(job.updated_at).getTime()) / 60000;
  let message = null;
  if      (job.status === 'accepted'    && ageMin > 5)  message = "Are you on your way? Don't forget to update your status";
  else if (job.status === 'on_the_way'  && ageMin > 5)  message = 'Have you picked up the load? Tap to update your status';
  else if (job.status === 'in_progress' && ageMin > 15) message = 'Have you collected cash and delivered? Tap to complete the job';
  if (message) { text.textContent = message; banner.style.display = 'flex'; }
  else         { banner.style.display = 'none'; }
}

function dismissReminder() {
  reminderDismissed = true;
  document.getElementById('reminder-banner').style.display = 'none';
}

async function init() {
  try {
    const { data, error } = await supabase
      .from('jobs')
      .select('*, trader:users!trader_id(name, phone)')
      .eq('driver_id', user.id)
      .in('status', ['accepted', 'on_the_way', 'in_progress'])
      .order('created_at', { ascending: false })
      .limit(1).maybeSingle();

    if (error) throw error;
    if (!data) { window.location.replace('driver-home.html'); return; }

    job = data;
    render();
    checkReminder();
    setupRealtime();
    setInterval(checkReminder, 60000);
  } catch (err) {
    console.error('driver-job init error:', err);
  }
}

init();
</script>
<script src="notifications.js"></script>
</body>
</html>
